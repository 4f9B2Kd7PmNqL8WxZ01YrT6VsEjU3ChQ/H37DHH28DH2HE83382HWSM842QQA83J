<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rhythm - Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Mona+Sans:wght@200..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-dark: #09090b;
        --card-bg: rgba(20, 20, 23, 0.9);
        --nav-bg: #000000;
        --card-border: rgba(255, 255, 255, 0.08);
        --primary: #22c55e;
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --font-head: 'Mona Sans', sans-serif;
        --font-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: 0; -webkit-tap-highlight-color: transparent; }
    body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    /* Toned down green glow */
    body::before {
        content: ''; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
        width: 100vw; height: 100vh;
        background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, rgba(9, 9, 11, 0) 60%);
        z-index: -1; pointer-events: none;
    }

    /* Header */
    header {
        height: 60px; padding: 0 20px; display: flex; align-items: center;
        background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid var(--card-border); z-index: 50;
    }
    .brand-text { font-family: var(--font-body); font-weight: 600; font-size: 20px; color: #fff; }
    .header-pill {
        margin-left: auto; /* Pushes to right */
        background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border);
        border-radius: 30px; padding: 4px; display: flex; gap: 8px;
    }
    .pill-btn {
        width: 32px; height: 32px; border-radius: 50%; background: #18181b; color: #fff;
        display: flex; justify-content: center; align-items: center; text-decoration: none;
        font-size: 14px; transition: 0.2s; position: relative;
    }
    .pill-btn.active-icon { color: var(--primary); }
    .notif-badge {
        position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: var(--primary);
        border-radius: 50%; display: none; border: 2px solid #18181b;
    }

    /* Main Feed */
    main { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 80px; position: relative; }
    .empty-state { text-align: center; margin-top: 50%; transform: translateY(-50%); }
    .empty-head { font-family: var(--font-head); font-weight: 800; font-size: 32px; color: var(--primary); margin-bottom: 8px; }
    .empty-sub { color: var(--text-muted); font-size: 14px; }

    /* Post Card */
    .post-card {
        background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;
        margin-bottom: 20px; overflow: hidden; animation: fadeIn 0.5s ease;
    }
    .post-header { padding: 12px; display: flex; align-items: center; gap: 10px; }
    .p-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #333; }
    .p-info h4 { font-size: 14px; font-weight: 600; }
    .p-info span { font-size: 12px; color: var(--text-muted); }
    .post-media { width: 100%; min-height: 200px; background: #000; display: flex; align-items: center; justify-content: center; }
    .post-media img, .post-media video { width: 100%; height: auto; max-height: 500px; object-fit: contain; }
    .post-content { padding: 12px; }
    .p-title { font-size: 15px; margin-bottom: 6px; }
    .p-tags { color: var(--primary); font-size: 13px; font-weight: 500; }

    /* Bottom Nav */
    .bottom-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
        background: var(--nav-bg); border-top: 1px solid var(--card-border);
        display: flex; justify-content: space-around; align-items: center; z-index: 100;
    }
    .nav-item { color: var(--primary); width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; border-radius: 12px; font-size: 20px; background: #000; }
    .nav-item.add-btn { background: var(--primary); color: #000; border-radius: 50%; width: 45px; height: 45px; box-shadow: 0 0 15px rgba(34,197,94,0.3); }

    /* Popups */
    .popup-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: var(--bg-dark); z-index: 200; display: none;
        flex-direction: column; padding: 20px; overflow-y: auto;
    }
    .popup-header { font-family: var(--font-head); font-size: 24px; font-weight: 700; margin-bottom: 20px; color: #fff; }
    .search-bar {
        width: 100%; background: #18181b; border: 1px solid var(--card-border);
        padding: 12px; border-radius: 12px; color: #fff; margin-bottom: 20px; font-family: var(--font-body);
    }
    
    /* Connect Friends Pills */
    .users-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 80px; }
    .user-pill {
        display: flex; align-items: center; background: rgba(255,255,255,0.03);
        padding: 10px; border-radius: 40px; border: 1px solid var(--card-border);
        justify-content: space-between; transition: 0.3s;
    }
    .u-left { display: flex; align-items: center; gap: 12px; }
    .u-img { width: 40px; height: 40px; border-radius: 50%; background: #333; object-fit: cover; }
    .u-txt h5 { font-size: 15px; font-weight: 600; }
    .u-txt span { font-size: 12px; color: var(--text-muted); }
    .link-btn {
        padding: 8px 16px; border-radius: 20px; background: #27272a; color: #fff;
        border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .link-btn.linked { background: var(--primary); color: #000; }
    
    .btn-float-bottom {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        width: 90%; background: var(--primary); padding: 16px; border-radius: 16px;
        border: none; font-weight: 700; font-size: 16px; cursor: pointer; color: #000;
    }

    /* Create Post */
    .cp-area { display: flex; flex-direction: column; gap: 20px; align-items: center; margin-top: 20px; }
    .upload-box {
        width: 100%; height: 200px; border: 2px dashed var(--card-border); border-radius: 20px;
        display: flex; justify-content: center; align-items: center; flex-direction: column;
        color: var(--text-muted); cursor: pointer; position: relative; overflow: hidden;
    }
    .upload-box i { font-size: 40px; margin-bottom: 10px; }
    .upload-preview { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; display:none; background:#000; }
    .cp-input {
        width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--card-border);
        padding: 10px; color: #fff; font-size: 16px; font-family: var(--font-body);
    }
    .tag-suggestions {
        max-height: 150px; overflow-y: auto; width: 100%; background: #18181b;
        border-radius: 12px; display: none; margin-top: -10px;
    }
    .tag-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 10px; }
    .tag-item img { width: 30px; height: 30px; border-radius: 50%; }

    /* Progress Loader */
    .loader-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
        z-index: 300; display: none; justify-content: center; align-items: center; flex-direction: column;
    }
    .progress-ring { width: 100px; height: 100px; }
    .progress-ring__circle {
        stroke: var(--primary); stroke-width: 4; fill: transparent; stroke-linecap: round;
        stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset 0.1s linear; transform: rotate(-90deg); transform-origin: 50% 50%;
    }
    .glow-ring { filter: drop-shadow(0 0 10px var(--primary)); }
    
    /* Notifications */
    .notif-item {
        background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px;
        display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--primary);
    }

    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

    <!-- Splash/Auth Check -->
    <div id="splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#09090b;z-index:9999;display:flex;justify-content:center;align-items:center;">
        <i class="fa-solid fa-circle-notch fa-spin" style="color:#22c55e;font-size:30px"></i>
    </div>

    <header>
        <div class="brand-text">Rhythm</div>
        <div class="header-pill">
            <div class="pill-btn" id="btn-notif">
                <i class="fa-solid fa-bell"></i>
                <div class="notif-badge" id="notif-dot"></div>
            </div>
            <a href="settings.html" class="pill-btn">
                <i class="fa-solid fa-gear"></i>
            </a>
        </div>
    </header>

    <main id="feed-container">
        <!-- Feed generated via JS -->
    </main>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="loadFeed()"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" onclick="openSearch()"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div class="nav-item add-btn" id="btn-add-post"><i class="fa-solid fa-plus"></i></div>
        <div class="nav-item"><i class="fa-solid fa-comment"></i></div>
        <div class="nav-item"><i class="fa-solid fa-user"></i></div>
    </nav>

    <!-- Connect Friends Popup -->
    <div id="view-connect" class="popup-overlay">
        <div class="popup-header">Connect with Friends</div>
        <input type="text" class="search-bar" id="search-friends" placeholder="Search people...">
        <div class="users-list" id="connect-list"></div>
        <button class="btn-float-bottom" id="btn-done-connect">Continue</button>
    </div>

    <!-- New Post Popup -->
    <div id="view-post" class="popup-overlay">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="popup-header" style="margin:0">New Post</div>
            <i class="fa-solid fa-xmark" onclick="closePost()" style="font-size:24px;color:#fff"></i>
        </div>
        <div class="cp-area">
            <div class="upload-box" id="upload-trigger">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Tap to upload</p>
                <p style="font-size:12px;margin-top:5px">Images or Video (Max 100MB)</p>
                <img id="prev-img" class="upload-preview">
                <video id="prev-vid" class="upload-preview" controls></video>
                <input type="file" id="file-input" hidden accept="image/*,video/*">
            </div>
            <input type="text" class="cp-input" id="post-title" placeholder="Caption your moment...">
            <input type="text" class="cp-input" id="post-tags" placeholder="Tag friends with &..." autocomplete="off">
            <div class="tag-suggestions" id="tag-list"></div>
        </div>
        <button class="btn-float-bottom" id="btn-submit-post">Post Rhythm</button>
    </div>

    <!-- Notification Popup -->
    <div id="view-notif" class="popup-overlay">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <div class="popup-header" style="margin:0">Notifications</div>
            <i class="fa-solid fa-xmark" onclick="document.getElementById('view-notif').style.display='none'" style="font-size:24px;color:#fff"></i>
        </div>
        <div id="notif-list"></div>
    </div>

    <!-- Post Preview Popup -->
    <div id="view-preview" class="popup-overlay" style="z-index:250">
        <i class="fa-solid fa-arrow-left" onclick="this.parentElement.style.display='none'" style="font-size:24px;margin-bottom:20px;color:#fff"></i>
        <div id="preview-content"></div>
    </div>

    <!-- Upload Loader -->
    <div class="loader-overlay" id="upload-loader">
        <svg class="progress-ring glow-ring">
            <circle class="progress-ring__circle" cx="50" cy="50" r="45"></circle>
        </svg>
        <p style="color:var(--primary);margin-top:20px;font-weight:600;letter-spacing:1px">CONVERTING...</p>
    </div>

<script type="module">
    // --- Config ---
    const _s="Salted__",_p=["Q1Z4cmJ4cWw=","T29wcywgdGhpcyBpcyBub3QgcmVhbA==","QUl6YVN5Qk9IUEZaWkNhTWdSdHNycmw1Y18zcmV6WlBzaGc5NFA4","cmh5dGhtY2hhdC1jMTQwZi5maXJlYmFzZWFwcC5jb20=","aHR0cHM6Ly9yaHl0aG1jaGF0LWMxNDBmLWRlZmF1bHQtcnRkYi5hc2lhLXNvdXRoZWFzdDEuZmlyZWJhc2VkYXRhYmFzZS5hcHA=","cmh5dGhtY2hhdC1jMTQwZg==","cmh5dGhtY2hhdC1jMTQwZi5maXJlYmFzZXN0b3JhZ2UuYXBw","NDU0MDAzOTYwNTA=","MTo0NTQwMDM5NjA1MDp3ZWI6ZmE5NTI1NjU4OTg5MmYxOTQwZTNjYg==","Ry1HUDFTR0RaTDZY"],_d=s=>atob(s);
    import {initializeApp}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import {getAuth}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import {getDatabase,ref,set,get,child,update}from"https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
    
    const app=initializeApp({apiKey:_d(_p[2]),authDomain:_d(_p[3]),databaseURL:_d(_p[4]),projectId:_d(_p[5]),storageBucket:_d(_p[6]),messagingSenderId:_d(_p[7]),appId:_d(_p[8]),measurementId:_d(_p[9])});
    const db=getDatabase(app);
    const auth=getAuth(app);
    
    // Globals
    let myUid = localStorage.getItem('rhythm_uid');
    let myEmail = "";
    let myData = {};
    let allUsers = [];
    let myFriends = [];
    let selectedFile = null;
    let taggedUsers = [];
    let allPosts = [];

    const safe = e => e.replace(/\./g, ',');

    // --- Init ---
    window.addEventListener('load', async () => {
        if(!myUid) { window.location.href="index.html"; return; }
        
        try {
            // Get all users to caching
            const snap = await get(ref(db, 'users'));
            if(snap.exists()) {
                const val = snap.val();
                allUsers = Object.values(val).map(u => u.data);
                
                // Find me
                const me = allUsers.find(u => u.uid === myUid);
                if(me) {
                    myEmail = me.email;
                    myData = me;
                    
                    // Check Friends
                    const fSnap = await get(ref(db, `users/${safe(myEmail)}/data/friends`));
                    if(fSnap.exists()) {
                        myFriends = Object.keys(fSnap.val());
                        loadFeed(); // Has friends, go to feed
                    } else {
                        showConnectScreen(); // No friends, show connect
                    }
                    
                    checkNotifications();
                }
            } else {
                window.location.href="index.html";
            }
        } catch(e) { console.error(e); }
        document.getElementById('splash').style.display='none';
    });

    // --- Friend Connection Logic ---
    function showConnectScreen() {
        const modal = document.getElementById('view-connect');
        modal.style.display = 'flex';
        renderUserList(allUsers.sort(() => 0.5 - Math.random()).slice(0, 10)); // Random 10
    }

    function renderUserList(list) {
        const c = document.getElementById('connect-list');
        c.innerHTML = '';
        list.forEach(u => {
            if(u.uid === myUid) return;
            const isLinked = myFriends.includes(u.uid);
            const d = document.createElement('div');
            d.className = 'user-pill';
            d.innerHTML = `
                <div class="u-left">
                    <img src="${u.profilePic||'https://via.placeholder.com/40'}" class="u-img">
                    <div class="u-txt"><h5>${u.name}</h5><span>@${u.username}</span></div>
                </div>
                <button class="link-btn ${isLinked?'linked':''}" data-uid="${u.uid}">
                    ${isLinked ? '<i class="fa-solid fa-link"></i> Linked' : 'Link'}
                </button>
            `;
            d.querySelector('button').onclick = (e) => toggleFriend(e.target, u.uid);
            c.appendChild(d);
        });
    }

    window.toggleFriend = async (btn, uid) => {
        if(btn.tagName === 'I') btn = btn.parentElement;
        const linking = !btn.classList.contains('linked');
        
        if(linking) {
            btn.classList.add('linked');
            btn.innerHTML = '<i class="fa-solid fa-link"></i> Linked';
            await set(ref(db, `users/${safe(myEmail)}/data/friends/${uid}`), true);
            myFriends.push(uid);
        } else {
            btn.classList.remove('linked');
            btn.innerText = 'Link';
            await set(ref(db, `users/${safe(myEmail)}/data/friends/${uid}`), null);
            myFriends = myFriends.filter(id => id !== uid);
        }
    };

    document.getElementById('search-friends').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const matches = allUsers.filter(u => 
            u.uid !== myUid && (u.name.toLowerCase().includes(term) || u.username.toLowerCase().includes(term))
        ).slice(0, 5); // Best 5
        renderUserList(matches.length ? matches : allUsers.slice(0,10));
    });

    document.getElementById('btn-done-connect').onclick = () => {
        document.getElementById('view-connect').style.display = 'none';
        loadFeed();
    };

    // --- Feed Logic ---
    window.loadFeed = async () => {
        const cont = document.getElementById('feed-container');
        cont.innerHTML = '<div style="text-align:center;margin-top:50px"><i class="fa-solid fa-spinner fa-spin" style="color:#22c55e;font-size:30px"></i></div>';
        
        allPosts = [];
        // Fetch posts from all users (as requested)
        for(let u of allUsers) {
            try {
                const pSnap = await get(ref(db, `users/${safe(u.email)}/data/posts`));
                if(pSnap.exists()) {
                    const posts = pSnap.val();
                    Object.values(posts).forEach(p => {
                        p.author = u;
                        allPosts.push(p);
                    });
                }
            } catch(e){}
        }

        cont.innerHTML = '';
        if(allPosts.length === 0) {
            cont.innerHTML = `
                <div class="empty-state">
                    <h1 class="empty-head">Hmm...</h1>
                    <p class="empty-sub">Nothing to show here</p>
                </div>`;
            return;
        }

        // Randomize
        allPosts.sort(() => 0.5 - Math.random());

        allPosts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            let media = '';
            if(post.type === 'video') {
                media = `<video src="${post.media}" controls playsinline></video>`;
            } else {
                media = `<img src="${post.media}">`;
            }
            
            card.innerHTML = `
                <div class="post-header">
                    <img src="${post.author.profilePic}" class="p-avatar">
                    <div class="p-info"><h4>${post.author.name}</h4><span>@${post.author.username}</span></div>
                </div>
                <div class="post-media">${media}</div>
                <div class="post-content">
                    <div class="p-title">${post.title}</div>
                    <div class="p-tags">${post.tagged ? 'with ' + post.tagged.map(t=>'@'+t.username).join(' ') : ''}</div>
                </div>
            `;
            cont.appendChild(card);
        });
    };

    // --- Create Post Logic ---
    document.getElementById('btn-add-post').onclick = () => document.getElementById('view-post').style.display='flex';
    window.closePost = () => document.getElementById('view-post').style.display='none';

    const uBox = document.getElementById('upload-trigger');
    const fIn = document.getElementById('file-input');
    
    uBox.onclick = () => fIn.click();
    fIn.onchange = (e) => {
        const f = e.target.files[0];
        if(!f) return;
        if(f.size > 100 * 1024 * 1024) { alert("File too large! Max 100MB"); return; }
        
        selectedFile = f;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const src = ev.target.result;
            if(f.type.startsWith('image')) {
                document.getElementById('prev-img').src = src;
                document.getElementById('prev-img').style.display = 'block';
                document.getElementById('prev-vid').style.display = 'none';
            } else {
                document.getElementById('prev-vid').src = src;
                document.getElementById('prev-vid').style.display = 'block';
                document.getElementById('prev-img').style.display = 'none';
            }
        };
        reader.readAsDataURL(f);
    };

    // Tagging
    const tagIn = document.getElementById('post-tags');
    const tagList = document.getElementById('tag-list');
    
    tagIn.addEventListener('input', (e) => {
        const val = e.target.value;
        if(val.endsWith('&')) {
            tagList.style.display = 'block';
            tagList.innerHTML = '';
            // Show friends to tag
            myFriends.forEach(fid => {
                const f = allUsers.find(u => u.uid === fid);
                if(f) {
                    const div = document.createElement('div');
                    div.className = 'tag-item';
                    div.innerHTML = `<img src="${f.profilePic}"><span>${f.username}</span>`;
                    div.onclick = () => {
                        taggedUsers.push({uid: f.uid, username: f.username});
                        tagIn.value = tagIn.value.slice(0, -1) + "@" + f.username + " ";
                        tagList.style.display = 'none';
                    };
                    tagList.appendChild(div);
                }
            });
        } else {
            tagList.style.display = 'none';
        }
    });

    // Submit Post
    document.getElementById('btn-submit-post').onclick = () => {
        if(!selectedFile) return alert("Please select a file");
        
        const loader = document.getElementById('upload-loader');
        const circle = document.querySelector('.progress-ring__circle');
        loader.style.display = 'flex';
        
        // Simulating progress while reading/converting
        let prog = 283; 
        const interval = setInterval(() => {
            prog -= 5;
            if(prog < 0) prog = 0;
            circle.style.strokeDashoffset = prog;
        }, 50);

        const reader = new FileReader();
        reader.readAsDataURL(selectedFile);
        reader.onload = async (e) => {
            clearInterval(interval);
            circle.style.strokeDashoffset = 0;
            
            const b64 = e.target.result;
            const pid = Date.now().toString(36) + Math.random().toString(36).substr(2);
            
            const postData = {
                id: pid,
                title: document.getElementById('post-title').value,
                media: b64,
                type: selectedFile.type.startsWith('video') ? 'video' : 'image',
                tagged: taggedUsers,
                timestamp: Date.now()
            };

            try {
                await set(ref(db, `users/${safe(myEmail)}/data/posts/${pid}`), postData);
                loader.style.display = 'none';
                closePost();
                loadFeed(); // Refresh
                // Reset form
                selectedFile = null;
                taggedUsers = [];
                document.getElementById('post-title').value = '';
                document.getElementById('post-tags').value = '';
                document.getElementById('prev-img').style.display='none';
                document.getElementById('prev-vid').style.display='none';
            } catch(err) {
                loader.style.display = 'none';
                alert("Upload failed. File might be too large for database limits.");
                console.error(err);
            }
        };
    };

    // --- Notifications ---
    document.getElementById('btn-notif').onclick = () => {
        document.getElementById('view-notif').style.display = 'flex';
        document.getElementById('notif-dot').style.display = 'none';
    };

    async function checkNotifications() {
        // Simple check: Look through all posts for tags of me
        const nList = document.getElementById('notif-list');
        let count = 0;
        nList.innerHTML = '';
        
        for(let u of allUsers) {
            try {
                const s = await get(ref(db, `users/${safe(u.email)}/data/posts`));
                if(s.exists()) {
                    const posts = s.val();
                    Object.values(posts).forEach(p => {
                        if(p.tagged && p.tagged.some(t => t.uid === myUid)) {
                            count++;
                            const div = document.createElement('div');
                            div.className = 'notif-item';
                            div.innerHTML = `
                                <img src="${u.profilePic}" style="width:30px;height:30px;border-radius:50%">
                                <div><b>${u.username}</b> tagged you in a post.</div>
                            `;
                            div.onclick = () => showPreview(p, u);
                            nList.appendChild(div);
                        }
                    });
                }
            } catch(e){}
        }
        
        if(count > 0) document.getElementById('notif-dot').style.display = 'block';
        else nList.innerHTML = '<div style="text-align:center;color:#666;margin-top:20px">No notifications</div>';
    }

    function showPreview(post, author) {
        const v = document.getElementById('view-preview');
        const c = document.getElementById('preview-content');
        v.style.display = 'flex';
        let m = post.type === 'video' ? `<video src="${post.media}" controls style="width:100%"></video>` : `<img src="${post.media}" style="width:100%">`;
        c.innerHTML = `
            <h2 style="margin-bottom:10px">${post.title}</h2>
            ${m}
            <p style="margin-top:10px;color:#aaa">By @${author.username}</p>
        `;
    }
    
    // Globals for HTML access
    window.openSearch = () => { document.getElementById('search-friends').focus(); showConnectScreen(); }

</script>
</body>
</html>
